# qr-toolbox 共享 logo API 部署配置
# 部署（凭据走环境变量，不进仓库）：
#   export CLOUDFLARE_API_TOKEN=<cf-workers-token>
#   npx wrangler kv namespace create QR_LOGOS   # 把返回的 id 填到下面
#   npx wrangler secret put SHARE_KEY            # 输入共享口令（存于 keys/qr-logos-vault.md）
#   npx wrangler deploy
# 前置：logos.1996818.xyz 的 A 记录（橙云代理）需先在 CF DNS 建好
name = "qr-logos"
main = "src/worker.js"
compatibility_date = "2026-01-01"

routes = [
  { pattern = "logos.1996818.xyz/*", zone_name = "1996818.xyz" }
]

[[kv_namespaces]]
binding = "QR_LOGOS"
id = "c8b9e123c74e4f1ca82372970c76f12d"
